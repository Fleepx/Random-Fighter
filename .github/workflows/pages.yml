# Publica el sitio compilado en GitHub Pages.
#
# Pages sirve el repositorio tal cual, y en la raiz esta el index.html de
# Vite, que apunta a /src/main.jsx. El navegador no puede ejecutar JSX, asi
# que la pagina salia en blanco. Esto compila y publica dist/, que es lo
# unico que un navegador entiende.
#
# dist/ no se versiona: se construye aca en cada push a main.

name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. Si llegan dos push seguidos, se cancela el
# anterior en vez de pelearse por publicar.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ci y no install: respeta package-lock.json al pie de la letra, para
      # que lo publicado se construya con las mismas versiones de siempre.
      - run: npm ci
      - run: npm run build

      # enablement cambia la fuente de Pages a "GitHub Actions" por API.
      # Sin esto el ajuste se queda en "Deploy from a branch" y GitHub
      # publica el repositorio crudo: corren los dos despliegues y gana el
      # de la rama, que es justo el que dejaba la pagina en blanco.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
