<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prototipo de intro — Random Fighter</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;900&family=Barlow:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --rojo: #C0392B;
    --rojo-vivo: #FF4A33;
    --negro: #0A0A0A;
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
  }

  body {
    background: var(--negro);
    color: #DECBCB;
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    overflow: hidden;
  }

  /* ─── La intro ─── */

  .intro {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: var(--negro);
    overflow: hidden;
    perspective: 620px;
    perspective-origin: 50% 50%;
  }
  .intro.is-fuera {
    opacity: 0;
    visibility: hidden;
    transition: opacity 700ms var(--ease), visibility 700ms var(--ease);
  }

  /* El tunel: marcos de puerta que vienen hacia la camara.
     Cada uno arranca lejos y chico, y pasa de largo. */
  .marco {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 74vmin;
    height: 74vmin;
    margin: -37vmin 0 0 -37vmin;
    border: 2.5vmin solid #14100F;
    border-radius: 2px;
    background-image: url('/cemento.jpg');
    background-size: 260% 260%;
    background-position: center;
    box-shadow:
      inset 0 0 8vmin rgba(0, 0, 0, 0.95),
      0 0 3vmin rgba(0, 0, 0, 0.8);
    transform-style: preserve-3d;
    opacity: 0;
    animation: avanzar var(--dur, 2600ms) var(--retardo, 0ms) linear forwards;
  }
  /* El marco es un aro: el centro se recorta para poder ver a traves */
  .marco::before {
    content: '';
    position: absolute;
    inset: 9vmin;
    background: transparent;
    box-shadow: 0 0 0 30vmin #14100F;
    border-radius: 2px;
  }

  @keyframes avanzar {
    0%   { transform: translateZ(-2600px) rotate(var(--giro, 0deg)); opacity: 0; }
    14%  { opacity: 0.55; }
    80%  { opacity: 0.55; }
    100% { transform: translateZ(760px) rotate(var(--giro, 0deg)); opacity: 0; }
  }

  /* La luz roja del fondo, que crece a medida que nos acercamos */
  .resplandor {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 40vmin;
    height: 40vmin;
    margin: -20vmin 0 0 -20vmin;
    border-radius: 50%;
    background: radial-gradient(circle,
      #FFD9C8 0%,
      rgba(255, 120, 80, 0.9) 12%,
      rgba(192, 57, 43, 0.5) 30%,
      rgba(120, 30, 22, 0.16) 52%,
      transparent 66%);
    filter: blur(1.2vmin);
    animation: crecer 2900ms var(--ease) forwards;
  }
  @keyframes crecer {
    0%   { transform: scale(0.04); opacity: 0; }
    16%  { opacity: 1; }
    100% { transform: scale(2.3); opacity: 1; }
  }

  /* La silueta: aparece contra la luz y nos pasa por al lado */
  /* A contraluz: negro puro recortado contra el resplandor rojo. La
     mascara radial borra las bandas de pared que arrastro el umbral en
     los bordes de la foto; sin ella se leen como fallas. */
  .silueta {
    position: absolute;
    bottom: -4vmin;
    left: 50%;
    height: 74vmin;
    transform-origin: 50% 100%;
    margin-left: -23vmin;
    opacity: 0;
    filter: brightness(0.06) contrast(2) drop-shadow(0 0 5vmin rgba(255,90,60,0.35));
    -webkit-mask-image: radial-gradient(58% 62% at 50% 46%, #000 52%, transparent 82%);
    mask-image: radial-gradient(58% 62% at 50% 46%, #000 52%, transparent 82%);
    animation: pasar 1600ms 1150ms var(--ease) forwards;
  }
  @keyframes pasar {
    0%   { transform: scale(0.42) translateY(4vmin); opacity: 0; }
    26%  { opacity: 1; }
    72%  { opacity: 1; }
    100% { transform: scale(2.1) translateY(-1vmin); opacity: 0; }
  }

  /* Polvo suspendido en el haz de luz */
  .polvo {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,180,160,0.5), transparent),
      radial-gradient(1.5px 1.5px at 70% 60%, rgba(255,180,160,0.4), transparent),
      radial-gradient(2px 2px at 45% 80%, rgba(255,180,160,0.35), transparent),
      radial-gradient(1.5px 1.5px at 85% 25%, rgba(255,180,160,0.45), transparent),
      radial-gradient(1.5px 1.5px at 30% 70%, rgba(255,180,160,0.3), transparent);
    animation: derivar 3000ms linear forwards;
    pointer-events: none;
  }
  @keyframes derivar {
    from { transform: translateY(4vmin) scale(1); opacity: 0; }
    30%  { opacity: 0.8; }
    to   { transform: translateY(-6vmin) scale(1.6); opacity: 0; }
  }

  /* Viñeta permanente, para que los bordes no compitan */
  .vineta {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%,
      transparent 38%, rgba(0,0,0,0.35) 68%, rgba(0,0,0,0.92) 100%);
    pointer-events: none;
  }

  /* El logo aterriza al final */
  .cierre {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3vmin;
    opacity: 0;
    animation: aterrizar 900ms 2350ms var(--ease) forwards;
  }
  @keyframes aterrizar {
    from { opacity: 0; transform: scale(1.35); filter: blur(1.4vmin); }
    to   { opacity: 1; transform: scale(1);    filter: blur(0); }
  }
  .cierre img { width: min(34vmin, 260px); height: auto; display: block; }
  .cierre p {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(0.9rem, 2.4vmin, 1.15rem);
    font-weight: 700;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: #fff;
    padding-left: 0.5em;
  }

  /* Saltar: disponible desde el primer momento */
  .saltar {
    position: absolute;
    right: 4vmin;
    bottom: 4vmin;
    z-index: 3;
    padding: 0.7rem 1.4rem;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 999px;
    color: rgba(255,255,255,0.75);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.875rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color 200ms var(--ease), color 200ms var(--ease);
  }
  .saltar:hover { border-color: var(--rojo); color: #fff; }

  /* ─── Lo que hay debajo, para ver la transicion ─── */

  .pagina {
    position: relative;
    min-height: 100vh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 2rem;
    background:
      radial-gradient(60vw 70vh at -10% 38%, rgba(192,57,43,0.28), transparent 70%),
      radial-gradient(55vw 65vh at 110% 62%, rgba(192,57,43,0.22), transparent 70%),
      var(--negro);
  }
  .pagina h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(2rem, 6vw, 3.4rem);
    font-weight: 900;
    text-transform: uppercase;
    line-height: 0.95;
    background: linear-gradient(to right, #FFF, #9B9B9B);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .pagina small { display: block; margin-top: 1.4rem; color: #9E9E9E; }
  .repetir {
    margin-top: 2rem; padding: 0.8rem 2rem; border: 0; border-radius: 2px;
    background: var(--rojo); color: #fff; cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; font-size: 1rem;
  }

  /* Quien pidio menos animacion no ve nada de esto */
  @media (prefers-reduced-motion: reduce) {
    .intro { display: none; }
  }
</style>
</head>
<body>

<div class="intro" id="intro">
  <div class="resplandor"></div>

  <div class="marco" style="--retardo:0ms;    --dur:2600ms; --giro:0deg"></div>
  <div class="marco" style="--retardo:340ms;  --dur:2600ms; --giro:0.6deg"></div>
  <div class="marco" style="--retardo:680ms;  --dur:2600ms; --giro:-0.5deg"></div>
  <div class="marco" style="--retardo:1020ms; --dur:2600ms; --giro:0.4deg"></div>
  <div class="marco" style="--retardo:1360ms; --dur:2600ms; --giro:-0.3deg"></div>

  <img class="silueta" src="/sil-guardia.png" alt="" />
  <div class="polvo"></div>
  <div class="vineta"></div>

  <div class="cierre">
    <img src="/logo-rf.png" alt="Random Fighter" />
    <p>Entrena Compite Supérate</p>
  </div>

  <button class="saltar" id="saltar" type="button">Saltar</button>
</div>

<main class="pagina">
  <div>
    <h1>Tus clases, tus pagos<br />y tus combates<br />en una sola app</h1>
    <small>Esta es la landing, simulada. La intro se cierra sola a los 3,2 s.</small>
    <button class="repetir" id="repetir" type="button">Ver la intro de nuevo</button>
  </div>
</main>

<script>
  const intro  = document.getElementById('intro');
  const saltar = document.getElementById('saltar');
  const repetir = document.getElementById('repetir');

  const DURACION = 3200;
  let temporizador;

  function cerrar() {
    clearTimeout(temporizador);
    intro.classList.add('is-fuera');
    document.body.style.overflow = '';
  }

  function abrir() {
    // Reiniciar animaciones: se clona el nodo para que el navegador
    // vuelva a correr los keyframes desde cero.
    const nuevo = intro.cloneNode(true);
    intro.replaceWith(nuevo);
    conectar(nuevo);
  }

  function conectar(nodo) {
    document.body.style.overflow = 'hidden';
    nodo.querySelector('#saltar').addEventListener('click', () => {
      nodo.classList.add('is-fuera');
      clearTimeout(temporizador);
      document.body.style.overflow = '';
    });
    temporizador = setTimeout(() => {
      nodo.classList.add('is-fuera');
      document.body.style.overflow = '';
    }, DURACION);
    window.__intro = nodo;
  }

  document.body.style.overflow = 'hidden';
  saltar.addEventListener('click', cerrar);
  temporizador = setTimeout(cerrar, DURACION);
  window.__intro = intro;

  repetir.addEventListener('click', () => {
    const actual = window.__intro;
    const nuevo = actual.cloneNode(true);
    nuevo.classList.remove('is-fuera');
    actual.replaceWith(nuevo);
    conectar(nuevo);
  });
</script>

</body>
</html>
